name: Update content index
on:
  push:
    branches: [main]
    paths: ['content/**', 'index.html', 'build-index.js']

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: node build-index.js
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add content/*/index.json og verhaal product voorwaarden disclaimer
          git diff --staged --quiet && exit 0
          git commit -m "Auto: update content index + deelpaginas"
          # Publiceert de klant twee verhalen kort na elkaar, dan kan deze push
          # verouderd zijn. Opnieuw proberen bovenop de nieuwe main in plaats van
          # falen - anders blijft een verhaal zonder deelpagina staan.
          for poging in 1 2 3; do
            if git push; then exit 0; fi
            echo "push mislukt (poging $poging), opnieuw bovenop origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "push na 3 pogingen niet gelukt"
          exit 1
